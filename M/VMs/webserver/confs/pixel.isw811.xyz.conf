<VirtualHost *:80>
    ServerAdmin webmaster@pixel.isw811.xyz
    ServerName pixel.isw811.xyz

    DirectoryIndex index.php index.html
    DocumentRoot /vagrant/sites/pixel.isw811.xyz/public

    <Directory /vagrant/sites/pixel.isw811.xyz/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/pixel.isw811.xyz.error.log
    CustomLog ${APACHE_LOG_DIR}/pixel.isw811.xyz.access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.pixel.isw811.xyz [OR]
    RewriteCond %{SERVER_NAME} =pixel.isw811.xyz
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>